<script>
const K='pena-padel-v2',$=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),fd=d=>d.split('-').reverse().join('/');

const pair=(g,ix)=>{const s=[...g].sort((x,y)=>ix(x)-ix(y)),d=s.filter(n=>pos(n)==='D'),r=s.filter(n=>pos(n)==='R');
 return d.length===2&&r.length===2?{a:[d[0],r[1]],b:[r[0],d[1]]}:{a:[s[0],s[3]],b:[s[1],s[2]]}};
function suggest(day){DSIDE=day.side||{};const K=day.att.length/4,R=day.rounds[day.rounds.length-1],rk=[...stats(day.id).L].sort((a,b)=>b.pts-a.pts||b.ppm-a.ppm||(b.gf-b.gc)-(a.gf-a.gc)).map(p=>p.n).filter(n=>day.att.includes(n)),ix=n=>rk.indexOf(n);
 if(!R){const ds=rk.filter(n=>pos(n)==='D'),rs=rk.filter(n=>pos(n)==='R');
  return Array.from({length:K},(_,k)=>ds.length===2*K&&rs.length===2*K?pair([ds[2*k],ds[2*k+1],rs[2*k],rs[2*k+1]],ix):pair(rk.slice(k*4,k*4+4),ix))}
 const W=R.map(m=>m[m.w]),L=R.map(m=>m[m.w==='a'?'b':'a']);
 return R.map((_,k)=>pair([...(k?L[k-1]:W[0]),...(k<K-1?W[k+1]:L[k])],ix))}
function stats(ex){const P={};S.players.forEach(p=>P[p.n]={n:p.n,pos:p.pos,off:p.off,ev:[],days:[],pj:0,pg:0,pp:0,gf:0,gc:0,r:0});
 const D=[...S.days].filter(d=>d.id!==ex).sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id);

  d.rounds.forEach(R=>R.forEach(m=>{const av=t=>t.reduce((s,n)=>s+(P[n]?P[n].r:0),0)/2,ea=1/(1+Math.pow(10,(av(m.b)-av(m.a))/S.cfg.s)),da=Math.round(S.cfg.k*(.5+.5*Math.sign(m.ga-m.gb)*Math.pow(Math.abs(m.ga-m.gb)/(m.ga+m.gb+S.cfg.c),S.cfg.g)-ea));
   [['a','b',m.ga,m.gb,da],['b','a',m.gb,m.ga,-da]].forEach(([s,o,f,c,dp])=>m[s].forEach(n=>{const p=P[n];if(!p)return;const w=m.w===s;
   p.ev.push({w,f,c,dp,k:m.c,d:d.date,pa:m[s].find(x=>x!==n),ri:m[o]});p.pj++;w?p.pg++:p.pp++;p.gf+=f;p.gc+=c;p.r+=dp}))}))});
 const L=Object.values(P),C=S.cfg;
 L.forEach(p=>{p.pts=p.r;p.ppm=p.pj?p.pts/p.pj:0;p.pct=p.pj?p.pg/p.pj:0;
  let c=0,b=0;p.ev.forEach(e=>{c=e.w?c+1:0;b=Math.max(b,c)});p.bw=b;
  let i=p.ev.length-1,u=0;const lw=i>=0&&p.ev[i].w;while(i>=0&&p.ev[i].w===lw){u++;i--}p.cs=lw?u:-u;
  p.nd=p.days.length;let a=0,ba=0,pr=-2;p.days.forEach(x=>{a=x===pr+1?a+1:1;ba=Math.max(ba,a);pr=x});p.bd=ba;p.cd=p.nd&&pr===D.length-1?a:0});
 return{L,D,P,N:D.length}}
function simRound(cs,str,r){const m=cs.map((c,i)=>({c:i+1,a:c.a,b:c.b,ga:0,gb:0})),s=p=>p.reduce((t,n)=>t+str[n],0);
 while(!m.some(x=>x.ga>=7||x.gb>=7))m.forEach(x=>{r()<s(x.a)/(s(x.a)+s(x.b))?x.ga++:x.gb++});
 m.forEach(x=>x.w=x.ga>x.gb?'a':x.gb>x.ga?'b':r()<.5?'a':'b');return m}
function mkDemo(){const N=['Ana','Luis','Marta','Pablo','Sara','Dani','Eva','Raúl','Carla','Iván','Nuria','Toni','Lola','Hugo'],str={};
 N.forEach((n,i)=>str[n]=17-i);let sd=7;const r=()=>{sd=sd+0x6D2B79F5|0;let t=Math.imul(sd^sd>>>15,1|sd);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
 S={name:'Peña de Pádel',demo:true,cfg:{k:335,s:3000,c:1.7,g:.5},players:N.map((n,i)=>({n,pos:i%2?'R':'D'})),days:[]};
 ['2026-09-16','2026-09-23','2026-09-30','2026-10-07'].forEach((date,i)=>{const ex=[(i*3+1)%14,(i*5+4)%14],d={id:i+1,date,att:N.filter((_,j)=>!ex.includes(j)),rounds:[]};
  S.days.push(d);for(let k=0;k<4;k++)d.rounds.push(simRound(suggest(d),str,r))})}

const nk=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase(),EMPTY=()=>({name:'Peña de Pádel',cfg:{k:335,s:3000,c:1.7,g:.5},players:[],days:[]}),norm=d=>{d.cfg=d.cfg&&d.cfg.c!=null?d.cfg:{k:335,s:3000,c:1.7,g:.5};d.players=d.players||[];d.days=d.days||[];return d};

const b64=s=>{const b=new TextEncoder().encode(s);let x='';for(let i=0;i<b.length;i+=8192)x+=String.fromCharCode(...b.subarray(i,i+8192));return btoa(x)};
const gh=(m,body,u='/contents/data.json')=>fetch('https://api.github.com/repos/'+GH.repo+u,{method:m,headers:{Authorization:'Bearer '+GH.tok,Accept:'application/vnd.github+json'},body:body&&JSON.stringify(body)});
async function ghLoad(){const r=await gh('GET');if(r.status===404){GH.sha=null;return null}if(!r.ok)throw r.status;const j=await r.json();GH.sha=j.sha;return JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(j.content.replace(/\n/g,'')),c=>c.charCodeAt(0))))}

 try{let r=await gh('PUT',body());if(r.status===409||r.status===422){await ghLoad();r=await gh('PUT',body())}if(!r.ok)throw r.status;GH.sha=(await r.json()).content.sha;toast('✓ Guardado',1)}catch(e){toast('⚠ No se pudo guardar ('+e+')')}})},msg=t=>{const e=$('#msg');if(e)e.textContent=t};
const opts=(a,s)=>'<option value="">—</option>'+a.map(n=>`<option ${n===s?'selected':''}>${esc(n)}</option>`).join('');
function ficha(p,st){const ev=e=>e?`${e.f}–${e.c} (${e.dp>0?'+':''}${e.dp}) con ${esc(e.pa)} vs ${esc(e.ri.join(' y '))} · ${fd(e.d)}`:'—';

 wsd(){const sw=[...document.querySelectorAll('.sw:checked')].map(x=>x.value);if(sw.length!==WZ.n)return msg('Elige exactamente '+WZ.n+'.');const o=WZ.from==='D'?'R':'D',side={};sw.forEach(n=>side[n]=o);A.wcreate(WZ.date,WZ.att,side)},
 wcreate(date,att,side){const d={id:Date.now(),date,att,rounds:[],live:true};if(Object.keys(side).length)d.side=side;S.days.push(d);d.next=suggest(d);WZ=null;WS='list';save();render()},
 wres(){WS='res';render()},wlist(){WS='list';render()},
 wnr(){const d=live();if(!wsave(0))return;d.next=suggest(d);WS='list';save();render()},
 wfin(){const d=live(),r=wsave(1);if(!r)return;if(!d.rounds.length){S.days=S.days.filter(x=>x!==d);WO=false;save();render();return}d.live=false;delete d.next;WFIN=d.id;save();render()},
 wcopy(){const t=$('#wtx');t.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}if(!ok&&navigator.clipboard)navigator.clipboard.writeText(t.value).catch(()=>{});$('#wm').textContent='✓ Copiado. Si no se copia, mantén pulsado el texto.'},
 async adin(){const repo=$('#gr').value.trim(),tok=$('#gt').value.trim();if(!/^[\w.-]+\/[\w.-]+$/.test(repo)||!tok)return msg('Rellena repositorio y token.');GH={repo,tok};
  try{const r=await gh('GET',null,''),j=await r.json();if(!r.ok||!j.permissions||!j.permissions.push)throw 'sin permiso de escritura';const d=await ghLoad();if(d)S=norm(d);ADMIN=true;try{localStorage.setItem('pena-gh',JSON.stringify({repo,tok}))}catch(e){}tab='adm';render()}catch(e){GH={};msg('Token o repositorio no válidos ('+e+').')}},
 adout(){ADMIN=false;GH={};try{localStorage.removeItem('pena-gh')}catch(e){}tab='clas';render()},
 delr(v){const [id,i]=v.split(':'),d=S.days.find(x=>x.id==id);if(d)ask('¿Borrar esta ronda?',()=>{d.rounds.splice(+i,1);save();render()})},
 ren(v,n,t){if(!n||n===v||S.players.some(p=>p.n===n)){if(t)t.value=v;return}S.players.find(p=>p.n===v).n=n;const f=a=>a.map(x=>x===v?n:x);S.days.forEach(d=>{d.att=f(d.att);d.rounds.forEach(R=>R.forEach(m=>{m.a=f(m.a);m.b=f(m.b)}))});if(ME===v)ME=n;save();render()},sort(v){sortBy=v;render()},posf(v){posF=v;open=null;render()},info(v){inf(INFO[v][0],INFO[v][1])},open(v){open=open===v?null:v;render()},
 mk(){DSIDE={};const date=$('#fd').value,att=[...document.querySelectorAll('.ck:checked')].map(x=>x.value);
  if(!date||att.length%4||att.length<4||att.length>12)return msg('Elige 4, 8 o 12 jugadores.');
  if(att.some(n=>!pos(n)))return msg('Falta asignar posición (D/R) en Ajustes.');
  const nd=att.filter(n=>pos(n)==='D').length,need=att.length/2;if(nd!==need){PEND={date,att,from:nd>need?'D':'R',n:Math.abs(nd-need)};return render()}
  A.mkDay(date,att,{})},
 mkDay(date,att,side){const d={id:Date.now(),date,att,rounds:[]};if(Object.keys(side).length)d.side=side;S.days.push(d);cur=d.id;PEND=null;save();render()},
 mk2(){const sw=[...document.querySelectorAll('.sw:checked')].map(x=>x.value);if(sw.length!==PEND.n)return msg('Elige exactamente '+PEND.n+'.');const o=PEND.from==='D'?'R':'D',side={};sw.forEach(n=>side[n]=o);A.mkDay(PEND.date,PEND.att,side)},
 mkx(){PEND=null;render()},
 edit(v){EDIT=v;render()},ecancel(){EDIT=null;render()},
 esave(){const[id,i,j]=EDIT.split(':'),d=S.days.find(x=>x.id==id),m=d.rounds[+i][+j],g=k=>$('#e'+k).value,ps=[g('a0'),g('a1'),g('b0'),g('b1')],ga=g('ga'),gb=g('gb');
  if(ps.some(x=>!x)||new Set(ps).size<4)return msg('Elige 4 jugadores distintos.');if(ga===''||gb==='')return msg('Falta el resultado.');
  m.a=[ps[0],ps[1]];m.b=[ps[2],ps[3]];m.ga=+ga;m.gb=+gb;m.w=+ga>+gb?'a':+gb>+ga?'b':g('w');
  d.att=[...new Set(d.rounds.flat().flatMap(x=>[...x.a,...x.b]))];EDIT=null;save();render()},
 delm(v){const[id,i,j]=v.split(':'),d=S.days.find(x=>x.id==id);if(d)ask('¿Borrar este partido?',()=>{d.rounds[+i].splice(+j,1);if(!d.rounds[+i].length)d.rounds.splice(+i,1);if(d.rounds.length)d.att=[...new Set(d.rounds.flat().flatMap(x=>[...x.a,...x.b]))];save();render()})},
 rsave(){const d=S.days.find(x=>x.id===cur),K=d.att.length/4,ms=[],all=[];
  for(let k=0;k<K;k++){const p=[0,1,2,3].map(j=>$('#p'+k+'_'+j).value),ga=$('#g'+k+'_a').value,gb=$('#g'+k+'_b').value,w=$('#w'+k).value;all.push(...p);
   if(ga===''||gb==='')return msg('Falta el resultado de la pista '+(k+1)+'.');
   if(+ga===+gb&&!w)return msg('Empate en la pista '+(k+1)+': indica quién sube.');
   ms.push({c:k+1,a:[p[0],p[1]],b:[p[2],p[3]],ga:+ga,gb:+gb,w:+ga>+gb?'a':+gb>+ga?'b':w==='A'?'a':'b'})}
  if(all.some(x=>!x)||new Set(all).size!==all.length)return msg('Cada jugador debe aparecer una sola vez.');
  d.rounds.push(ms);save();render();scrollTo(0,0)},
 undo(){const d=S.days.find(x=>x.id===cur);if(d)ask('¿Quitar la última ronda?',()=>{d.rounds.pop();save();render()})},
 delday(v){ask('¿Borrar esta jornada?',()=>{S.days=S.days.filter(d=>d.id!=v);if(cur==v)cur=null;save();render()})},
 cfgsave(){S.name=$('#pn').value.trim()||'Peña de Pádel';const cl=(v,a,b,d)=>Math.min(b,Math.max(a,+v||d));S.cfg={k:cl($('#ck').value,50,1500,335),s:cl($('#cs').value,500,20000,3000),c:cl($('#cc').value,.1,20,1.7),g:cl($('#cg').value,.3,2,.5)};save();render()},
 addp(){const n=$('#np').value.trim();if(!n||S.players.some(p=>p.n===n))return;S.players.push({n,pos:$('#npos').value});save();render()},
 rmp(v){const p=S.players.find(x=>x.n===v);if(!p)return;if(S.days.some(d=>d.att.includes(v))){if(p.off){p.off=false;save();render()}else ask(v+' tiene partidos jugados. Se archivará: sale de la clasificación pero se conserva su historial.',()=>{p.off=true;save();render()});return}ask('¿Eliminar a '+v+'?',()=>{S.players=S.players.filter(x=>x.n!==v);save();render()})},
 exp(){$('#bk').value=JSON.stringify(S)},
 imp(){try{const d=JSON.parse($('#bk').value);if(!d.players||!d.days)throw 0;S=d;if(!S.cfg||S.cfg.c==null)S.cfg={k:335,s:3000,c:1.7,g:.5};save();render()}catch(e){alert('Copia no válida.')}},
 reset(){ask('Se borrarán jugadores y jornadas. ¿Seguro?',()=>{S={name:S.name,cfg:S.cfg,players:[],days:[]};cur=null;save();render()})},
 demo(){ask('Se sustituirán tus datos por el ejemplo. ¿Seguro?',()=>{mkDemo();cur=null;save();render()})}};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(t&&A[t.dataset.act])A[t.dataset.act](t.dataset.v,t)});
document.addEventListener('change',e=>{const t=e.target.closest('[data-chg]');if(!t)return;
 if(t.dataset.chg==='dsel'){cur=t.value?+t.value:null;render()}
 if(t.dataset.chg==='ren')A.ren(t.dataset.v,t.value.trim(),t);
 if(t.dataset.chg==='pos'){const p=S.players.find(x=>x.n===t.dataset.v);if(p){p.pos=t.value;save()}}});
render();
(async()=>{let g=null;try{g=JSON.parse(localStorage.getItem('pena-gh'))}catch(e){}
 if(g&&g.tok){GH=g;try{S=norm((await ghLoad())||EMPTY());ADMIN=true}catch(e){GH={};try{localStorage.removeItem('pena-gh')}catch(x){}}}
 if(!S){try{const r=await fetch('data.json?'+Date.now());S=r.ok?norm(await r.json()):EMPTY()}catch(e){S=EMPTY()}}
 render()})();
</script></body></html>
